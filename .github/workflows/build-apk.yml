
name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --legacy-peer-deps
      - run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android
      - name: Bloqueador V5 AGRESIVO - Patrocinado 2 de 2
        run: |
          MAIN=android/app/src/main/java/com/versatilidad/youtube/MainActivity.java
          cat > $MAIN << 'JAVA'
          package com.versatilidad.youtube;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView w = getBridge().getWebView();
              WebSettings s = w.getSettings();
              s.setUserAgentString("Mozilla/5.0 (Linux; Android 13; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");
              s.setDomStorageEnabled(true);
              s.setJavaScriptEnabled(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              s.setMediaPlaybackRequiresUserGesture(false);
              final WebViewClient original = w.getWebViewClient();
              w.setWebViewClient(new WebViewClient(){
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request){
                  String url = request.getUrl().toString().toLowerCase();
                  // Lista agresiva de ads
                  if(url.contains("doubleclick") || url.contains("googleadservices") || url.contains("googlesyndication") || url.contains("adservice") || url.contains("googleads") || url.contains("/pagead/") || url.contains("get_midroll") || url.contains("stats/ads") || url.contains("ptracking") || url.contains("ad_break") || url.contains("adplacem") || url.contains("google.com/pagead") || url.contains("youtube.com/api/stats/qoe") && url.contains("ad")){
                    return new WebResourceResponse("text/plain","utf-8", new java.io.ByteArrayInputStream("".getBytes()));
                  }
                  if(original != null){
                    try{ WebResourceResponse r = original.shouldInterceptRequest(view, request); if(r != null) return r; }catch(Exception e){}
                  }
                  return null;
                }
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request){
                  if(original != null){
                    try{ return original.shouldOverrideUrlLoading(view, request); }catch(Exception e){ return false; }
                  }
                  return false;
                }
                @Override
                public void onPageFinished(WebView view, String url){
                  if(original != null){ try{ original.onPageFinished(view, url); }catch(Exception e){} }
                  if(url != null && url.contains("youtube.com")){
                    view.evaluateJavascript("(function(){ var css=document.createElement('style'); css.innerHTML='.ytp-ad-overlay-container,.ytp-ad-image-overlay,.ytp-ad-module,.video-ads,.ytp-pause-overlay{display:none!important} #player-ads,#masthead-ad{display:none!important}'; document.documentElement.appendChild(css); function skipAd(){ var v=document.querySelector('video'); if(!v) return; var adShowing=document.querySelector('.ad-showing') || document.querySelector('.ytp-ad-player-overlay') || document.querySelector('.ytp-ad-module'); var isAd = adShowing || (v && v.duration && v.duration < 10 && document.querySelector('.ytp-ad-text')); if(adShowing || isAd || (document.body.innerHTML.includes('Patrocinado'))){ if(v){ v.muted=true; v.playbackRate=16; try{ if(v.duration && v.duration>0 && v.duration<1000){ v.currentTime=v.duration-0.05; } }catch(e){} v.volume=0; } var btns=document.querySelectorAll('.ytp-ad-skip-button,.ytp-ad-skip-button-modern,.ytp-skip-ad-button, .ytp-ad-skip-button-slot button, button.ytp-ad-skip-button'); btns.forEach(function(b){ try{ b.click(); b.dispatchEvent(new MouseEvent('click',{bubbles:true})); }catch(e){} }); var close=document.querySelector('.ytp-ad-overlay-close-button'); if(close) close.click(); } var skip=document.querySelector('.ytp-ad-skip-button,.ytp-ad-skip-button-modern'); if(skip){ skip.click(); } } setInterval(skipAd,200); setInterval(function(){ var v=document.querySelector('video'); if(v && v.paused && document.querySelector('.ad-showing')){ v.play(); } },500); })();", null);
                  }
                }
              });
            }
          }
          JAVA
      - run: chmod +x android/gradlew
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Versatilidad-Musical-BLOQUEADOR-V5
          path: android/app/build/outputs/apk/debug/app-debug.apk
