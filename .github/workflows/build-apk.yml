name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Crear proyecto Android limpio con Java 17
        run: |
          rm -rf android
          npx cap add android
          # Forzar todo a Java 17 para evitar error invalid source release: 21
          sed -i 's/21/17/g' android/variables.gradle || true
          sed -i 's/21/17/g' android/app/build.gradle || true
          sed -i 's/21/17/g' android/build.gradle || true
          npx cap copy android
          npx cap sync android
          cat android/variables.gradle

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Versatilidad-Musical
          path: android/app/build/outputs/apk/debug/app-debug.apk
