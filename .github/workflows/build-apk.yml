
name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --legacy-peer-deps
      - run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android
      - name: Parte 8 que si abrio + Bloqueador sin romper localhost
        run: |
          MAIN=android/app/src/main/java/com/versatilidad/youtube/MainActivity.java
          cat > $MAIN << 'JAVA'
          package com.versatilidad.youtube;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView w = getBridge().getWebView();
              WebSettings s = w.getSettings();
              s.setUserAgentString("Mozilla/5.0 (Linux; Android 13; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");
              s.setDomStorageEnabled(true);
              s.setJavaScriptEnabled(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              s.setMediaPlaybackRequiresUserGesture(false);
              // Obtenemos el cliente original de Capacitor y lo envolvemos
              WebViewClient original = w.getWebViewClient();
              w.setWebViewClient(new WebViewClient(){
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request){
                  String urlStr = request.getUrl().toString();
                  String host = request.getUrl().getHost();
                  // 1. Si es localhost/capacitor -> dejar que lo maneje Capacitor original
                  if(host != null && (host.equals("localhost") || host.contains("capacitor") || urlStr.contains("localhost") || urlStr.contains("capacitor://"))){
                    if(original != null){
                      return original.shouldInterceptRequest(view, request);
                    }
                    return null;
                  }
                  // 2. Bloqueador de ads - solo para youtube y google ads
                  String url = urlStr.toLowerCase();
                  if(url.contains("doubleclick.net") || url.contains("googleadservices.com") || url.contains("googlesyndication.com") || url.contains("adservice.google") || url.contains("youtube.com/api/stats/ads") || url.contains("youtube.com/pagead/") || url.contains("youtube.com/get_midroll_") || url.contains("google.com/pagead")){
                    return new WebResourceResponse("text/plain","utf-8", new java.io.ByteArrayInputStream("".getBytes()));
                  }
                  // Para todo lo demas, usar el original si existe
                  if(original != null){
                    return original.shouldInterceptRequest(view, request);
                  }
                  return null;
                }
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request){
                  String host = request.getUrl().getHost();
                  if(host != null && (host.equals("localhost") || host.contains("capacitor"))){
                    return false;
                  }
                  if(original != null){
                    return original.shouldOverrideUrlLoading(view, request);
                  }
                  return false;
                }
                @Override
                public void onPageFinished(WebView view, String url){
                  if(original != null){
                    original.onPageFinished(view, url);
                  } else {
                    super.onPageFinished(view, url);
                  }
                  if(url != null && (url.contains("youtube.com") || url.contains("localhost"))){
                    view.evaluateJavascript("(function(){var st=document.createElement('style');st.innerHTML='.ytp-ad-overlay-container, .ytp-ad-image-overlay{display:none!important}';document.head.appendChild(st);function skip(){var ad=document.querySelector('.ad-showing');if(ad){var v=document.querySelector('video');if(v){v.muted=true;if(v.duration){v.currentTime=v.duration-0.1;}}var btn=document.querySelector('.ytp-ad-skip-button, .ytp-ad-skip-button-modern, .ytp-skip-ad-button');if(btn)btn.click();}var sk=document.querySelector('.ytp-ad-skip-button, .ytp-ad-skip-button-modern');if(sk)sk.click();}setInterval(skip,500);})();", null);
                  }
                }
              });
            }
          }
          JAVA
      - run: chmod +x android/gradlew
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Versatilidad-Musical-PARTE8-BLOQUEADOR
          path: android/app/build/outputs/apk/debug/app-debug.apk
