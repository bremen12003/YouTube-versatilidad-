name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Agregar plataforma Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      - name: Fix WebView - Quita X-Frame-Options y 404
        run: |
          MAIN=android/app/src/main/java/com/versatilidad/youtube/MainActivity.java
          mkdir -p $(dirname $MAIN)
          cat > $MAIN << 'JAVA'
          package com.versatilidad.youtube;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import java.util.Map;
          import java.util.HashMap;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView w = getBridge().getWebView();
              WebSettings s = w.getSettings();
              s.setUserAgentString("Mozilla/5.0 (Linux; Android 13; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");
              s.setDomStorageEnabled(true);
              s.setJavaScriptEnabled(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              w.setWebViewClient(new WebViewClient(){
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request){
                  try{
                    String url = request.getUrl().toString();
                    // Solo interceptar youtube para quitar X-Frame-Options que da ERR_BLOCKED_BY_RESPONSE
                    if(url.contains("youtube.com") || url.contains("youtube-nocookie.com")){
                      HttpURLConnection conn = (HttpURLConnection) new URL(url).openConnection();
                      conn.setRequestProperty("User-Agent","Mozilla/5.0 (Linux; Android 13; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");
                      for(Map.Entry<String,String> h : request.getRequestHeaders().entrySet()){
                        if(!h.getKey().equalsIgnoreCase("X-Requested-With")) conn.setRequestProperty(h.getKey(), h.getValue());
                      }
                      conn.connect();
                      String mime = conn.getContentType();
                      if(mime==null) mime="text/html";
                      if(mime.contains(";")) mime=mime.split(";")[0];
                      InputStream is = conn.getInputStream();
                      Map<String,String> headers = new HashMap<>();
                      // quitar X-Frame-Options para que no de ERR_BLOCKED
                      for(Map.Entry<String, java.util.List<String>> e : conn.getHeaderFields().entrySet()){
                        if(e.getKey()==null) continue;
                        String k=e.getKey().toLowerCase();
                        if(k.equals("x-frame-options") || k.equals("content-security-policy")) continue;
                        headers.put(e.getKey(), e.getValue().get(0));
                      }
                      return new WebResourceResponse(mime, "UTF-8", 200, "OK", headers, is);
                    }
                  }catch(Exception e){}
                  return null;
                }
              });
            }
          }
          JAVA

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Versatilidad-Musical
          path: android/app/build/outputs/apk/debug/app-debug.apk
