
name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --legacy-peer-deps
      - run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android
      - name: Navegador con AdBlock Nativo
        run: |
          MAIN=android/app/src/main/java/com/versatilidad/youtube/MainActivity.java
          cat > $MAIN << 'JAVA'
          package com.versatilidad.youtube;
          import android.os.Bundle;
          import android.webkit.*;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              android.webkit.WebView w = getBridge().getWebView();
              android.webkit.WebSettings s = w.getSettings();
              s.setUserAgentString("Mozilla/5.0 (Linux; Android 13; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");
              s.setDomStorageEnabled(true);
              s.setJavaScriptEnabled(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient(){
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request){
                  String url = request.getUrl().toString().toLowerCase();
                  if(url.contains("doubleclick.net") || url.contains("googleadservices.com") || url.contains("googlesyndication.com") || url.contains("adservice.google") || url.contains("youtube.com/api/stats/ads") || url.contains("youtube.com/pagead/") || url.contains("youtube.com/get_midroll_")){
                    return new WebResourceResponse("text/plain","utf-8", new java.io.ByteArrayInputStream("".getBytes()));
                  }
                  return null;
                }
                @Override
                public void onPageFinished(WebView view, String url){
                  super.onPageFinished(view, url);
                  view.evaluateJavascript("(function(){setInterval(function(){var ad=document.querySelector('.ad-showing');if(ad){var v=document.querySelector('video');if(v){v.currentTime=v.duration;}var b=document.querySelector('.ytp-ad-skip-button');if(b)b.click();}var s=document.querySelector('.ytp-ad-skip-button');if(s)s.click();},500);})();", null);
                }
              });
            }
          }
          JAVA
      - run: chmod +x android/gradlew
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Versatilidad-Musical-SIN-ADS
          path: android/app/build/outputs/apk/debug/app-debug.apk
