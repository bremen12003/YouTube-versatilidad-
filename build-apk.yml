name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Agregar plataforma Android
        run: npx cap add android

      - name: Copiar plugin nativo SaveFile
        run: cp native-patches/SaveFilePlugin.java android/app/src/main/java/com/versatilidad/editor/SaveFilePlugin.java

      - name: Registrar plugin en MainActivity
        run: cp native-patches/MainActivity.java android/app/src/main/java/com/versatilidad/editor/MainActivity.java

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: samples-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
