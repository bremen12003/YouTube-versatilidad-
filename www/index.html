<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Versatilidad Musical</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Roboto,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#0f0f0f;padding:12px;border-bottom:1px solid #303030}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:900;font-size:18px;white-space:nowrap}
.logo b{color:#ff0000}
.search-box{flex:1;display:flex;min-width:200px;background:#121212;border:1px solid #303030;border-radius:24px;overflow:hidden;margin-left:10px}
.search-box input{flex:1;background:transparent;border:none;color:#fff;padding:10px 14px;font-size:15px;outline:none}
.search-box button{background:#303030;border:none;color:#fff;padding:0 16px;font-size:18px}
.chips{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#0f0f0f;flex-shrink:0}
.chip{white-space:nowrap;background:#272727;color:#fff;border:none;padding:7px 14px;border-radius:8px;font-size:14px}
#playerWrap{flex:1;background:#000;position:relative}
#ytframe{width:100%;height:100%;border:none;background:#000}
#grid{display:grid;grid-template-columns:1fr;gap:0;flex:1;overflow-y:auto;background:#0f0f0f}
.video-card{display:flex;gap:10px;padding:10px;border-bottom:1px solid #222;cursor:pointer}
.video-card img{width:160px;height:90px;object-fit:cover;border-radius:8px;background:#222}
.video-card .info{flex:1}
.video-card .title{font-size:14px;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-card .chan{font-size:12px;color:#aaa;margin-top:4px}
</style>
</head>
<body>
<header>
<div class="top">
<div class="logo"><b>YouTube</b> Versatilidad Musical</div>
<div class="search-box">
<input id="q" type="text" placeholder="Buscar José José..." value="Versatilidad Musical Galvez">
<button onclick="doSearch()">🔍</button>
</div>
</div>
</header>
<div class="chips">
<button class="chip" onclick="doSearch('Versatilidad Musical')">Todo</button>
<button class="chip" onclick="doSearch('Jose Jose')">José José</button>
<button class="chip" onclick="doSearch('Banda MS')">Banda</button>
<button class="chip" onclick="doSearch('Cumbia')">Cumbia</button>
<button class="chip" onclick="doSearch('Salsa Romantica')">Salsa</button>
</div>
<div id="playerWrap">
<div id="grid"></div>
<iframe id="ytframe" style="display:none" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>
<script>
const grid = document.getElementById('grid');
const frame = document.getElementById('ytframe');
const input = document.getElementById('q');

// Usamos invidious API publica que no bloquea iframe
async function doSearch(txt){
  const query = txt || input.value || 'Versatilidad Musical Galvez';
  input.value = query;
  grid.style.display='grid';
  frame.style.display='none';
  grid.innerHTML='<div style="padding:20px;text-align:center;color:#aaa">Buscando '+query+'...</div>';
  try{
    // Invidious search - funciona sin API key
    const res = await fetch('https://yewtu.be/api/v1/search?q='+encodeURIComponent(query));
    const data = await res.json();
    grid.innerHTML='';
    data.forEach(v=>{
      if(v.type!=='video') return;
      const div=document.createElement('div');
      div.className='video-card';
      div.innerHTML=`<img src="${v.videoThumbnails[0].url}"><div class="info"><div class="title">${v.title}</div><div class="chan">${v.author} • ${v.viewCountText}</div></div>`;
      div.onclick=()=>playVideo(v.videoId);
      grid.appendChild(div);
    });
    if(grid.innerHTML==='') throw 'empty';
  }catch(e){
    // Fallback a embed search directo de YouTube que SI permite iframe
    grid.innerHTML='';
    const id='fallback';
    playVideoDirect(query);
  }
}

function playVideo(videoId){
  grid.style.display='none';
  frame.style.display='block';
  // Este embed SI permite Cast nativo a TV Sala
  frame.src='https://www.youtube.com/embed/'+videoId+'?autoplay=1&rel=0&modestbranding=1&playsinline=1';
}

function playVideoDirect(query){
  grid.style.display='none';
  frame.style.display='block';
  frame.src='https://www.youtube-nocookie.com/embed?listType=search&list='+encodeURIComponent(query)+'&autoplay=0';
}

input.addEventListener('keydown',e=>{if(e.key==='Enter') doSearch()});
doSearch('Versatilidad Musical Galvez');
</script>
</body>
</html>
