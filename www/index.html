<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#000;padding:10px;display:flex;align-items:center;gap:10px}
.logo{color:#ff0000;font-weight:900;font-size:20px}
.search{flex:1;display:flex;gap:8px}
.search input{flex:1;background:#222;border:none;border-radius:20px;padding:10px 14px;color:#fff;outline:none}
.search button{background:#fff;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:700}
iframe{flex:1;width:100%;border:none;background:#000}
</style>
</head>
<body>
<header>
<div class="logo">YouTube</div>
<div class="search">
<input id="q" placeholder="Buscar">
<button onclick="go()">Aceptar</button>
</div>
</header>
<iframe id="yt" src="https://www.youtube-nocookie.com/embed?listType=search&list=Mana" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<script>
function go(){
  const q=document.getElementById('q').value.trim();
  if(!q) return;
  document.getElementById('yt').src='https://www.youtube-nocookie.com/embed?listType=search&list='+encodeURIComponent(q)+'&autoplay=1';
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter') go();});
</script>
</body>
</html>
