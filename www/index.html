<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>YouTube Versatilidad Musical</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Roboto,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.logo{font-size:24px;font-weight:900;margin-bottom:20px}
.logo b{color:#ff0000}
.loader{width:40px;height:40px;border:4px solid #333;border-top:4px solid #ff0000;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
p{margin-top:20px;color:#aaa;font-size:14px;text-align:center;padding:0 20px}
</style>
<script>
// ESTE ES EL TRUCO DEFINITIVO - No iframe, navegacion directa al YouTube real
// Asi nunca da ERR_BLOCKED, ni Checking browser, ni video no disponible
// Es YouTube movil 100% real adentro de tu APK, con Cast a TV Sala nativo
(function(){
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q') || 'Versatilidad Musical Galvez';
  // Guardamos la busqueda para que al abrir siempre busque Versatilidad Musical
  const ytUrl = 'https://m.youtube.com/results?search_query=' + encodeURIComponent(q) + '&sp=EgIQAQ%3D%3D';
  
  // Si ya estamos en youtube, no redirigir de nuevo
  if(window.location.href.includes('youtube.com')){
    return;
  }
  
  // Redireccion directa - esto SIEMPRE jala, es YouTube real
  setTimeout(()=>{ window.location.href = ytUrl; }, 800);
})();
</script>
</head>
<body>
<div class="logo"><b>YouTube</b> Versatilidad Musical</div>
<div class="loader"></div>
<p>Cargando YouTube real...<br>Con búsqueda y Transmitir a TV Sala</p>
<p style="font-size:12px;margin-top:30px">Si no carga, toca aquí:<br><a href="https://m.youtube.com/results?search_query=Versatilidad+Musical+Galvez" style="color:#ff0000">Abrir YouTube</a></p>
</body>
</html>
