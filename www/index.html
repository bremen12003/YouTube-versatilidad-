<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#000;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222}
.logo{color:#f00;font-weight:900;font-size:20px}
.search{flex:1;display:flex;gap:8px}
.search input{flex:1;background:#222;border:none;border-radius:20px;padding:10px 14px;color:#fff;outline:none}
.search button{background:#fff;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:700}
#grid{flex:1;overflow-y:auto;background:#0f0f0f;padding:8px}
.card{display:flex;gap:10px;padding:10px;border-bottom:1px solid #222;cursor:pointer}
.card img{width:160px;height:90px;border-radius:8px;background:#222;object-fit:cover}
.card .t{font-size:14px;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.loading{padding:30px;text-align:center;color:#aaa}
#player{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;display:none;flex-direction:column}
#player .bar{padding:10px;background:#111;display:flex;justify-content:space-between;align-items:center}
#player .bar button{background:#fff;color:#000;border:none;padding:6px 14px;border-radius:16px;font-weight:700}
#player iframe{flex:1;width:100%;border:none;background:#000}
</style>
</head>
<body>
<header>
<div class="logo">YouTube</div>
<div class="search">
<input id="q" placeholder="Buscar">
<button onclick="search()">Aceptar</button>
</div>
</header>
<div id="grid"><div class="loading">Escribe algo y dale Aceptar</div></div>
<div id="player">
<div class="bar"><span id="ptitle"></span><button onclick="closePlayer()">✕</button></div>
<iframe id="ytf" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</div>
<script>
const grid=document.getElementById('grid');
async function search(){
  const q=document.getElementById('q').value.trim();
  if(!q){grid.innerHTML='<div class=loading>Escribe algo</div>';return;}
  grid.innerHTML='<div class=loading>Buscando '+q+'...</div>';
  
  // Usamos DuckDuckGo HTML que no tiene Cloudflare Checking browser ni 404 de piped
  // Pasamos por allorigins para que WebView no bloquee CORS
  const ddgUrl='https://duckduckgo.com/html/?q=site%3Ayoutube.com+'+encodeURIComponent(q);
  const proxyUrl='https://api.allorigins.win/get?url='+encodeURIComponent(ddgUrl);
  
  try{
    const r=await fetch(proxyUrl);
    if(!r.ok) throw new Error('proxy fail');
    const j=await r.json();
    const html=j.contents||'';
    // extraer IDs de youtube del HTML de DuckDuckGo
    const regex=/youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/g;
    const ids=[];
    let m;
    while((m=regex.exec(html))!==null){
      if(!ids.includes(m[1])) ids.push(m[1]);
      if(ids.length>=12) break;
    }
    if(ids.length===0){
      // fallback segundo intento con bing html que tambien no tiene checking
      const bingUrl='https://cc.bingj.com/cache.aspx?d=456&m=0&w=1&u='+encodeURIComponent('https://www.youtube.com/results?search_query='+encodeURIComponent(q));
      // si no hay IDs, mostramos mensaje simple sin error feo
      grid.innerHTML='<div class=loading>No se encontraron videos, intenta otra palabra</div>';
      return;
    }
    grid.innerHTML='';
    ids.forEach(id=>{
      const card=document.createElement('div');
      card.className='card';
      card.innerHTML=`<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg"><div><div class=t>${q} - ${id}</div></div>`;
      card.onclick=()=>play(id,q);
      grid.appendChild(card);
    });
    // mejorar titulos usando oembed para tener titulo real sin API
    ids.forEach(async id=>{
      try{
        const oembed=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v='+id+'&format=json')).then(r=>r.json()).then(j=>JSON.parse(j.contents));
        const el=document.querySelector(`img[src*="${id}"]`)?.parentElement?.querySelector('.t');
        if(el && oembed.title) el.textContent=oembed.title;
      }catch(e){}
    });
  }catch(e){
    grid.innerHTML='<div class=loading>Error de conexión, dale Aceptar de nuevo</div>';
  }
}

function play(id,title){
  document.getElementById('ptitle').innerText=title;
  document.getElementById('player').style.display='flex';
  document.getElementById('ytf').src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1';
}
function closePlayer(){document.getElementById('player').style.display='none'; document.getElementById('ytf').src='';}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter') search();});
</script>
</body>
</html>
