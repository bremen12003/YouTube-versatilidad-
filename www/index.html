<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
// Si estamos en m.youtube.com directo (por server.url), no necesitamos iframe, pero lo dejamos por si acaso
if(window.location.href.includes('m.youtube.com')){
  // Estamos directo en youtube, el bloqueo lo hace MainActivity
} else {
  document.write('<iframe id="yt" src="https://m.youtube.com/" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:0"></iframe>');
}
</script>
</body>
</html>
