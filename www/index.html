<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;font-family:Arial,sans-serif;justify-content:center;align-items:center}
.logo{color:#f00;font-weight:900;font-size:32px;margin-bottom:30px;letter-spacing:-1px}
.box{width:90%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.box input{background:#1a1a1a;border:1px solid #333;border-radius:24px;padding:14px 18px;color:#fff;outline:none;font-size:16px;width:100%}
.box button{background:#fff;color:#000;border:none;padding:14px;border-radius:24px;font-weight:800;font-size:16px;cursor:pointer}
.box .hint{color:#777;text-align:center;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="logo">YouTube</div>
<div class="box">
<input id="q" placeholder="Buscar" autofocus>
<button onclick="go()">Aceptar</button>
<button onclick="enter()" style="background:#222;color:#fff;border:1px solid #333">Entrar directo a YouTube</button>
<div class="hint">Si se queda buscando, dale Entrar directo. Nunca da 404 ni Checking browser.</div>
</div>
<script>
function go(){
  const q=document.getElementById('q').value.trim();
  if(!q){ enter(); return; }
  // Entrada directa a YouTube real, no API, no Piped, no se queda en Buscando...
  window.location.href='https://m.youtube.com/results?search_query='+encodeURIComponent(q);
}
function enter(){
  window.location.href='https://m.youtube.com/';
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter') go();});
</script>
</body>
</html>
