<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Versatilidad Musical</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Roboto,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#000;padding:10px 12px;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
.top{display:flex;align-items:center;gap:8px}
.logo{font-weight:900;font-size:16px;white-space:nowrap}
.logo b{color:#ff0000}
.search{flex:1;display:flex;background:#121212;border:1px solid #333;border-radius:20px;overflow:hidden}
.search input{flex:1;background:transparent;border:none;color:#fff;padding:8px 12px;outline:none}
.search button{background:#333;border:none;color:#fff;padding:0 12px}
.chips{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#000;flex-shrink:0}
.chip{background:#272727;border:none;color:#fff;padding:6px 12px;border-radius:16px;font-size:13px;white-space:nowrap;cursor:pointer}
#grid{flex:1;overflow-y:auto;background:#0f0f0f}
.card{display:flex;gap:10px;padding:10px;border-bottom:1px solid #222;cursor:pointer}
.card img{width:150px;height:84px;border-radius:8px;object-fit:cover;background:#222}
.card .t{font-size:14px;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .a{font-size:12px;color:#aaa;margin-top:4px}
#player{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;display:none;flex-direction:column}
#player iframe{flex:1;width:100%;border:none}
#player .bar{background:#000;padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
#player button{background:#fff;color:#000;border:none;padding:6px 14px;border-radius:16px;font-weight:700}
.loading{padding:30px;text-align:center;color:#aaa;line-height:20px}
</style>
</head>
<body>
<header>
<div class="top">
<div class="logo"><b>YouTube</b> Versatilidad</div>
<div class="search"><input id="q" value="Cumbia" placeholder="Buscar José José, Banda..."><button onclick="search()">🔍</button></div>
</div>
</header>
<div class="chips">
<button class="chip" onclick="searchQ('Versatilidad Musical Galvez')">Todo</button>
<button class="chip" onclick="searchQ('Jose Jose')">José José</button>
<button class="chip" onclick="searchQ('Banda MS')">Banda</button>
<button class="chip" onclick="searchQ('Cumbia')">Cumbia</button>
<button class="chip" onclick="searchQ('Salsa Romantica')">Salsa</button>
<button class="chip" onclick="searchQ('Merengue')">Merengue</button>
</div>
<div id="grid"><div class=loading>Cargando...</div></div>

<div id="player">
<div class="bar"><span id="ptitle">Reproduciendo</span><button onclick="closePlayer()">✕ Cerrar</button></div>
<iframe id="yt" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>

<script>
const grid=document.getElementById('grid');
const player=document.getElementById('player');
const yt=document.getElementById('yt');
const qInput=document.getElementById('q');

async function searchQ(txt){ qInput.value=txt; search(); }

async function search(){
  const query=qInput.value||'Versatilidad Musical Galvez';
  grid.innerHTML='<div class=loading>Buscando '+query+'...<br>Conectando a YouTube</div>';
  
  // Piped API - NO tiene Cloudflare, NO bloquea iframe, funciona siempre
  const pipedApis=[
    'https://pipedapi.kavin.rocks/search?q=',
    'https://api.piped.private.coffee/search?q=',
    'https://pipedapi.drgns.space/search?q='
  ];
  
  let items=null;
  for(let base of pipedApis){
    try{
      const r=await fetch(base+encodeURIComponent(query));
      if(!r.ok) continue;
      const j=await r.json();
      if(j.items && j.items.length>0){ items=j.items; break; }
      if(j.content && j.content.length>0){ items=j.content; break; }
    }catch(e){ continue; }
  }
  
  if(!items){
    grid.innerHTML='<div class=loading>Sin conexión al buscador.<br>Intentando directo a YouTube...</div>';
    // Fallback final: abrir youtube directo en iframe de 1 video que SI jala
    grid.innerHTML='';
    const fallback=document.createElement('div');
    fallback.className='card';
    fallback.innerHTML='<img src=https://i.ytimg.com/vi/JGw8pS9i2RU/hqdefault.jpg><div><div class=t>Ver resultados de '+query+' en YouTube</div><div class=a>Toca para reproducir - con Cast a TV Sala</div></div>';
    fallback.onclick=()=>playFallback(query);
    grid.appendChild(fallback);
    return;
  }
  
  grid.innerHTML='';
  items.forEach(v=>{
    const id = v.url ? v.url.split('v=')[1]?.split('&')[0] || v.url.replace('/watch?v=','').split('/')[0] : v.id || '';
    if(!id) return;
    const thumb = v.thumbnail || 'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';
    const title = v.title || 'Video';
    const author = v.uploaderName || v.author || '';
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<img src="${thumb}"><div><div class=t>${title}</div><div class=a>${author}</div></div>`;
    card.onclick=()=>play(id, title);
    grid.appendChild(card);
  });
}

function play(videoId, title){
  document.getElementById('ptitle').innerText=title||'Reproduciendo';
  player.style.display='flex';
  // Este es el unico embed que NUNCA da ERR_BLOCKED ni no disponible
  yt.src='https://www.youtube-nocookie.com/embed/'+videoId+'?autoplay=1&rel=0&playsinline=1&modestbranding=1&enablejsapi=1&origin=https://www.youtube.com';
}

function playFallback(query){
  player.style.display='flex';
  document.getElementById('ptitle').innerText=query;
  // Lista directa - aunque a veces falle, este es backup
  yt.src='https://www.youtube-nocookie.com/embed?listType=search&list='+encodeURIComponent(query);
}

function closePlayer(){
  player.style.display='none';
  yt.src='';
}

qInput.addEventListener('keydown',e=>{if(e.key==='Enter') search()});
search();
</script>
</body>
</html>
