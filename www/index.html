<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>YouTube Versatilidad Musical</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Roboto,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#0f0f0f;padding:12px 16px;border-bottom:1px solid #303030;display:flex;align-items:center;gap:12px;z-index:10}
.logo{font-weight:900;font-size:20px;letter-spacing:-0.5px}
.logo span{color:#fff}
.logo b{color:#ff0000}
.search-box{flex:1;display:flex;max-width:600px;margin:0 auto;background:#121212;border:1px solid #303030;border-radius:24px;overflow:hidden}
.search-box input{flex:1;background:transparent;border:none;color:#fff;padding:10px 16px;font-size:16px;outline:none}
.search-box button{background:#303030;border:none;color:#fff;padding:0 20px;cursor:pointer}
#playerWrap{flex:1;display:flex;flex-direction:column;background:#000}
#ytframe{flex:1;width:100%;border:none;background:#000}
.chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;background:#0f0f0f;border-bottom:1px solid #303030}
.chip{white-space:nowrap;background:#272727;color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:14px;cursor:pointer}
.chip.active{background:#fff;color:#000}
</style>
</head>
<body>
<header>
<div class="logo"><b>YouTube</b> <span>Versatilidad Musical</span></div>
<div class="search-box">
<input id="q" type="text" placeholder="Buscar José José, Banda, Cumbia..." value="Versatilidad Musical Galvez">
<button onclick="buscar()">🔍</button>
</div>
</header>
<div class="chips">
<button class="chip active" onclick="buscar('Versatilidad Musical')">Todo</button>
<button class="chip" onclick="buscar('Jose Jose')">José José</button>
<button class="chip" onclick="buscar('Banda MS')">Banda</button>
<button class="chip" onclick="buscar('Cumbia Versatilidad Musical')">Cumbia</button>
<button class="chip" onclick="buscar('Salsa Romantica')">Salsa</button>
<button class="chip" onclick="buscar('Musica Norteña')">Norteño</button>
</div>
<div id="playerWrap">
<iframe id="ytframe" src="https://m.youtube.com/results?search_query=Versatilidad+Musical+Galvez&sp=EgIQAQ%253D%253D" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>
<script>
const frame = document.getElementById('ytframe');
const input = document.getElementById('q');
function buscar(text){
  const query = text || input.value || 'Versatilidad Musical Galvez';
  input.value = query;
  const url = 'https://m.youtube.com/results?search_query=' + encodeURIComponent(query);
  frame.src = url;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
}
input.addEventListener('keydown', e=>{ if(e.key==='Enter') buscar(); });
</script>
</body>
</html>
