<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Sin Ads</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#000;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222}
.logo{color:#f00;font-weight:900;font-size:20px}
.search{flex:1;display:flex;gap:8px}
.search input{flex:1;background:#222;border:none;border-radius:20px;padding:10px 14px;color:#fff;outline:none}
.search button{background:#fff;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:700}
#grid{flex:1;overflow-y:auto;background:#0f0f0f;padding:8px}
.card{display:flex;gap:10px;padding:10px;border-bottom:1px solid #222;cursor:pointer}
.card img{width:160px;height:90px;border-radius:8px;background:#222;object-fit:cover}
.card .t{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.loading{padding:30px;text-align:center;color:#aaa}
#player{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;display:none;flex-direction:column}
#player .bar{padding:10px;background:#111;display:flex;justify-content:space-between;align-items:center}
#player .bar button{background:#fff;color:#000;border:none;padding:6px 14px;border-radius:16px;font-weight:700}
video,iframe{flex:1;width:100%;border:none;background:#000}
</style>
</head>
<body>
<header>
<div class="logo">YouTube</div>
<div class="search">
<input id="q" placeholder="Musica">
<button onclick="search()">Aceptar</button>
</div>
</header>
<div id="grid"><div class="loading">Escribe y dale Aceptar - Sin anuncios</div></div>
<div id="player">
<div class="bar"><span id="ptitle"></span><button onclick="closePlayer()">✕ Cerrar</button></div>
<video id="vid" controls autoplay playsinline style="display:none"></video>
<iframe id="ytf" style="display:none" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</div>
<script>
const PIPED = [
  'https://pipedapi.kavin.rocks',
  'https://pipedapi.syncpundit.io',
  'https://pipedapi.adminforge.de',
  'https://api.piped.privacydev.net',
  'https://pipedapi.leptos-software.eu.org',
  'https://pipedapi.drgns.space'
];
const INVIDIOUS = [
  'https://inv.tux.pizza/api/v1/search?q=',
  'https://yewtu.be/api/v1/search?q=',
  'https://invidious.privacydev.net/api/v1/search?q=',
  'https://inv.vern.cc/api/v1/search?q=',
  'https://vid.priv.au/api/v1/search?q='
];

async function search(){
  const q=document.getElementById('q').value.trim()||'Musica';
  const grid=document.getElementById('grid');
  grid.innerHTML='<div class=loading>Buscando '+q+'...</div>';
  
  // 1. intentar Piped
  for(let base of PIPED){
    try{
      const r=await fetch(base+'/search?q='+encodeURIComponent(q));
      if(!r.ok) continue;
      const data=await r.json();
      const items=data.content||data.items;
      if(items && items.length>0){
        showPiped(items); return;
      }
    }catch(e){}
  }
  // 2. intentar Invidious si Piped fallo (es lo que te daba Error)
  for(let url of INVIDIOUS){
    try{
      const r=await fetch(url+encodeURIComponent(q));
      if(!r.ok) continue;
      const items=await r.json();
      if(items && items.length>0){
        showInvidious(items); return;
      }
    }catch(e){}
  }
  grid.innerHTML='<div class=loading>Error: APIs caidas ahora. Dale Aceptar de nuevo en 10 seg<br><br>Si no, usa YouTube normal mientras<br><button onclick="location.href=\'https://m.youtube.com/results?search_query='+encodeURIComponent(q)+'\'" style="background:#fff;color:#000;border:none;padding:10px 18px;border-radius:20px">Ir a YouTube normal</button></div>';
}

function showPiped(items){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  items.slice(0,20).forEach(v=>{
    const id = v.url ? v.url.split('v=')[1] || v.url.split('/').pop().split('&')[0] : v.id;
    if(!id) return;
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<img src="${v.thumbnail||'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg'}"><div><div class=t>${v.title}</div><div style="font-size:12px;color:#aaa">${v.uploaderName||v.author||''}</div></div>`;
    card.onclick=()=>play(id, v.title);
    grid.appendChild(card);
  });
}
function showInvidious(items){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  items.slice(0,20).forEach(v=>{
    const id=v.videoId;
    if(!id) return;
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg"><div><div class=t>${v.title}</div><div style="font-size:12px;color:#aaa">${v.author||''}</div></div>`;
    card.onclick=()=>play(id, v.title);
    grid.appendChild(card);
  });
}

async function play(id, title){
  document.getElementById('ptitle').innerText=title||'';
  document.getElementById('player').style.display='flex';
  const video=document.getElementById('vid');
  const iframe=document.getElementById('ytf');
  video.style.display='none'; iframe.style.display='none';
  video.src=''; iframe.src='';
  video.poster='https://i.ytimg.com/vi/'+id+'/hqdefault.jpg';
  
  for(let base of PIPED){
    try{
      const r=await fetch(base+'/streams/'+id);
      if(!r.ok) continue;
      const j=await r.json();
      let url=null;
      if(j.videoStreams){
        const best=j.videoStreams.filter(s=>s.mimeType&&s.mimeType.includes('mp4')&&s.height<=720).sort((a,b)=>b.height-a.height)[0] || j.videoStreams[0];
        if(best) url=best.url;
      }
      if(url){
        video.style.display='block';
        video.src=url;
        video.play(); return;
      }
    }catch(e){}
  }
  // fallback sin anuncios? youtube-nocookie si todo falla
  iframe.style.display='block';
  iframe.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1';
}

function closePlayer(){
  document.getElementById('player').style.display='none';
  document.getElementById('vid').pause(); document.getElementById('vid').src='';
  document.getElementById('ytf').src='';
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter') search();});
</script>
</body>
</html>
